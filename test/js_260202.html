<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/js_260202.css">
    <script src="js/jquery-3.7.1.min.js"></script> <!-- jQuery -->
    <title>Javascript & jQuery 연습</title>
</head>
<body>
    <h1>글자</h1>
    <div class="btn_wrap">
        <button class="red">빨간버튼</button>
        <button class="blue">파란버튼</button>
    </div>
    <script>
        console.log('출력');
        // $('h1').addClass('blue');
        $('h1').on('mouseenter', function() {
            console.log('h1 mouseenter');
            $('h1').addClass('blue');
        });
        $('h1').on('mouseleave', function() {
            console.log('h1 mouseleave');
            $('h1').removeClass('blue');
        });

        $('.btn_wrap button.red').on('click', function() {
            console.log('빨간 버튼 클릭, .btn_wrap button.red click');
            $('h1').removeClass(); // 클래스 전부 삭제
            $('h1').addClass('red');            
        });
        $('.btn_wrap button.blue').on('click', function() {
            console.log('파란 버튼 클릭, .btn_wrap button.blue click');
            $('h1').removeClass(); // 클래스 전부 삭제
            $('h1').addClass('blue');
        });
    </script>
</body>
</html>
