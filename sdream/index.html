<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 1. 외부 라이브러리 파일 먼저 불러오기 -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    <!-- 2. 내 파일 불러오기 -->
    <script src="js/main.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <title>삼성꿈장학재단</title>
</head>
<body>
    <div id="wrap">
        <header class="header">
        </header>
        <main class="container">
            <section class="visual">
                <div class="swiper"> <!-- 팝업의 높이와 넓이를 css에서 줄 수 있는 요소-->
                    <ul class="swiper-wrapper"> <!-- 각 팝업 콘텐츠를 감싸는 요소-->
                        <li class="swiper-slide pop1">
                            <div class="wrapper">
                                <strong>Samsung Dream Scholarship Foundation</strong>
                                <h2>차별 없는 교육,<br>
                                    꿈을 향한 끝없는 도전
                                </h2>
                            </div>
                        </li>
                        <li class="swiper-slide pop2">
                            <div class="wrapper">
                                <strong>Samsung Dream Scholarship Foundation</strong>
                                <h2>꿈에 날개를, <br>
                                    배움에 희망을
                                </h2> <!-- PC에서 줄바꿈 제거 -->
                            </div>
                        </li>
                        <li class="swiper-slide pop3">
                            <div class="wrapper">
                                <strong>Samsung Dream Scholarship Foundation</strong>
                                <h2>배움의 열정으로 <br>
                                    내일을 밝히다
                                </h2> <!-- PC에서 줄바꿈 제거 -->
                            </div>
                        </li>
                        <li class="swiper-slide pop4">
                            <div class="wrapper">
                                <strong>Samsung Dream Scholarship Foundation</strong>
                                <h2>오늘의 꿈이<br>
                                    내일의 빛이 될 수 있도록
                                </h2>
                            </div>
                        </li>
                    </ul>
                </div>
                <div class="scroll"><span>Scroll Down</span></div>
            </section> <!-- //visual -->
            <section class="biz">

            </section><!-- //biz -->
            <section class="news">

            </section><!-- //news -->
            <section class="webzine">

            </section><!-- //webzine -->
            <section class="service">

            </section><!-- //service -->
        </main>
        <footer class="footer">

        </footer>
    </div>
</body>
</html>
